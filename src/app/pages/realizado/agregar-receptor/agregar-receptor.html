<ion-header>
  <ion-toolbar color="cabecera">
    <ion-buttons style="width: 30px" slot="start">
      <ion-back-button color="primary"></ion-back-button>
    </ion-buttons>
    <ion-title color="primary" style="text-align: center"
      >Nuevo Receptor</ion-title
    >
  </ion-toolbar>
</ion-header>

<ion-content class="principal">
  <ion-list style="margin-top: 10px; height: 330px">
    <ion-input
      [(ngModel)]="nombre"
      type="text"
      placeholder="Nombre"
      value=""
    ></ion-input>
    <ion-input
      [(ngModel)]="apellido"
      type="text"
      placeholder="Apellido"
      value=""
    ></ion-input>
    <ion-input
      [(ngModel)]="puesto"
      type="text"
      placeholder="Puesto"
      value=""
    ></ion-input>
  </ion-list>

  <div class="btn">
    <ion-button expand="full" strong="true" [disabled]="guardando" (click)="receptor()">Guardar</ion-button>
  </div>
  <div class="btn2">
    <ion-button expand="full" strong="true" (click)="cancelar()">Cancelar</ion-button>
  </div>
</ion-content>
