<ion-content padding>
  <ion-row
    style="
      height: 32vh;
      display: flex;
      justify-content: center;
      align-content: center;
      background: transparent;
      margin-top: 9.41vh;
    "
  >
    <ion-col
      style="display: flex; align-content: center; justify-content: center"
    >
      <img src="assets/img/imgs/logo_1.svg" width="60%" alt="" />
    </ion-col>
  </ion-row>
  <ion-row style="margin-top: 4.3vh">
    <ion-col>
      <ion-item>
        <ion-input
          [(ngModel)]="user"
          type="text"
          placeholder="Usuario"
          style="text-align: center"
        ></ion-input>
      </ion-item>
    </ion-col>
  </ion-row>

  <ion-row>
    <ion-col>
      <ion-item>
        <ion-input
          (keydown.enter)="doLogin()"
          [(ngModel)]="password"
          type="password"
          placeholder="Contraseña"
          style="text-align: center"
        ></ion-input>
      </ion-item>
    </ion-col>
  </ion-row>

  <ion-row style="height: 36px; margin-top: 80px">
    <ion-col style="display: flex; justify-content: center">
      <ion-button color="primary" expand="block" style="font-size: 18px; text-transform: uppercase; font-weight: 700; width: 162px; height: 36px;" (click)="doLogin()">
        Entrar
      </ion-button>
    </ion-col>
  </ion-row>

  <ion-row>
    <ion-col style="text-align: center">
      <ion-text color="warning">
        <p style="font-size: 13px; font-weight: 700; margin-bottom: 2px">
          ⚠️ Versión en desarrollo
        </p>
      </ion-text>
      <ion-text color="medium">
        <p style="font-size: 12px; margin-top: 0; padding: 0 16px">
          Esta es una versión de prueba (MensajeroDEV) y no corresponde a la
          versión oficial de la aplicación.
        </p>
      </ion-text>
    </ion-col>
  </ion-row>
</ion-content>
